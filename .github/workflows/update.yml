name: Update Watchlist

on:
  schedule:
    # 08:23 UTC = 17:23 JST, 月〜金。
    # 毎時0分はGitHub全体で混雑し数時間遅延・スキップされやすい（実績: 18:00指定→22時〜翌1時台に実行）ため、半端な分にずらす。
    - cron: '23 8 * * 1-5'
  workflow_dispatch:
    inputs:
      force:
        description: '価格が変わっていなくてもpush/通知する'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: write

concurrency:
  group: watchlist-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Update data.json
        id: update
        env:
          GCHAT_WEBHOOK: ${{ secrets.GCHAT_WEBHOOK }}
          JQUANTS_API_KEY: ${{ secrets.JQUANTS_API_KEY }}
        run: |
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            python3 .github/scripts/update.py --force
          else
            python3 .github/scripts/update.py
          fi

      - name: Commit and push
        if: steps.update.outputs.changed == 'true'
        run: |
          git config user.name "watchlist-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data.json
          git commit -m "自動更新 $(date -u -d '+9 hours' '+%Y-%m-%d %H:%M') JST"
          git push
