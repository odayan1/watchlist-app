<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ウォッチリスト｜保有理由ダッシュボード</title>
<script src="./lightweight-charts.standalone.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.0/marked.min.js"></script>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:"Hiragino Sans","Yu Gothic",system-ui,sans-serif;background:#0d1117;color:#e6edf3}
  .app{display:flex;min-height:100vh}
  .rail{width:220px;flex-shrink:0;border-right:1px solid #21262d;padding:14px 10px;position:sticky;top:0;height:100vh;overflow-y:auto}
  .rail h3{font-size:11px;color:#7d8590;text-transform:uppercase;letter-spacing:.5px;margin:2px 6px 12px}
  .stock{padding:10px;border-radius:10px;cursor:pointer;margin-bottom:6px;border:1px solid transparent}
  .stock:hover{background:#161b22}.stock.active{background:#161b22;border-color:#1f6feb}
  .stock .sn{font-weight:700;font-size:13.5px;line-height:1.3}.stock .sc{color:#7d8590;font-size:11px}
  .stock .sp{font-size:15px;font-weight:700;margin-top:4px}
  .stock .v2{font-size:10.5px;margin-top:3px}
  .chip{display:inline-block;font-size:10px;padding:1px 6px;border-radius:20px;font-weight:600;margin-top:5px}
  .st-hold{background:#3fb95022;color:#3fb950}.st-watch{background:#7d859022;color:#adbac7}
  .st-limit{background:#d2992222;color:#e3b341}.st-sold{background:#6e768133;color:#6e7681}
  .main{flex:1;padding:22px;max-width:1000px}
  .head{display:flex;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;gap:12px;border-bottom:1px solid #21262d;padding-bottom:14px;margin-bottom:18px}
  .name{font-size:23px;font-weight:700}.code{color:#7d8590;font-size:13px;margin-left:8px}
  .price{font-size:36px;font-weight:800;letter-spacing:-1px}.chg{font-size:15px;font-weight:600}
  .up{color:#3fb950}.down{color:#f85149}.asof{color:#6e7681;font-size:11px;margin-top:4px}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:10px;margin-bottom:18px}
  .card{background:#161b22;border:1px solid #21262d;border-radius:11px;padding:12px 14px}
  .card .label{color:#7d8590;font-size:11px;margin-bottom:5px}.card .val{font-size:20px;font-weight:700}
  .card .sub{color:#6e7681;font-size:10.5px;margin-top:3px}
  .hl{border-color:#1f6feb;box-shadow:0 0 0 1px #1f6feb33}.warn{border-color:#f8514955}
  .section{background:#161b22;border:1px solid #21262d;border-radius:11px;padding:18px;margin-bottom:16px}
  .section h2{font-size:14px;font-weight:700;margin-bottom:12px}
  .rangebar{position:relative;height:44px;margin:26px 4px 32px}
  .track{position:absolute;top:18px;left:0;right:0;height:8px;border-radius:4px;background:linear-gradient(90deg,#f85149,#d29922,#3fb950)}
  .marker{position:absolute;top:6px;width:3px;height:32px;background:#fff;border-radius:2px}
  .mlabel{position:absolute;top:-16px;transform:translateX(-50%);font-size:11px;font-weight:700;white-space:nowrap}
  .mlabel .sm{display:block;color:#7d8590;font-weight:400;font-size:10px;text-align:center}
  .legend{display:flex;gap:16px;font-size:12px;color:#adbac7;margin-bottom:8px}
  .legend i{display:inline-block;width:14px;height:3px;vertical-align:middle;margin-right:5px}
  .prose{color:#adbac7;font-size:13px;line-height:1.75}
  .prose b,.prose strong{color:#e6edf3}.prose ul{margin:4px 0 4px 18px}.prose p{margin:6px 0}
  .lwc{position:relative;height:420px;border-radius:10px;overflow:hidden;border:1px solid #21262d}
  .lwc .cv{position:absolute;inset:0}
  .lwc .lg{position:absolute;left:8px;top:6px;z-index:5;font-size:12px;line-height:1.5;pointer-events:none;background:rgba(13,17,23,.78);padding:4px 8px;border-radius:8px;color:#adbac7}
  .lwc .lg b.u{color:#f87171}.lwc .lg b.d{color:#60a5fa}
  .tbar{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
  .tbar button{background:#0d1117;color:#adbac7;border:1px solid #30363d;border-radius:16px;padding:4px 11px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit}
  .tbar button.on{background:#1f6feb;color:#fff;border-color:#1f6feb}
  .tbar .sp{flex:1}
  .legend i.dash{background:repeating-linear-gradient(90deg,#e6edf3 0 4px,transparent 4px 7px)!important}
  @media(max-width:640px){.lwc{height:360px}}
  .foot{color:#6e7681;font-size:11px;text-align:center;margin-top:14px;line-height:1.6}
  .empty{padding:60px;text-align:center;color:#7d8590}
  @media(max-width:640px){.app{flex-direction:column}.rail{width:auto;height:auto;position:static;border-right:none;border-bottom:1px solid #21262d;display:flex;gap:8px;overflow-x:auto}.rail h3{display:none}.stock{min-width:150px}}
</style>
</head>
<body>
<div class="app">
  <div class="rail"><h3>銘柄</h3><div id="list"></div></div>
  <div class="main" id="main"><div class="empty">読み込み中…</div></div>
</div>
<script>
let STOCKS=[], selected=null, chart=null;
const ST={"保有中":"st-hold","監視中":"st-watch","指値待ち":"st-limit","売却済":"st-sold"};
const curSym=c=>c==="USD"?"$":c==="EUR"?"€":"¥";
const fmt=(v,c)=>v==null?"—":curSym(c)+Math.round(v).toLocaleString();
const pct=v=>v==null?"—":(v>=0?"+":"")+v.toFixed(Math.abs(v)>=100?0:1)+"%";
const num=(v,d=2)=>v==null?"—":Number(v).toFixed(d);

function renderList(){
  document.getElementById("list").innerHTML=STOCKS.map(r=>{
    if(r.type==="index"){
      const mdc=r.miniDeadCross||{};
      const label=mdc.warning?"⚠️ 警戒中":(mdc.crossed?"5w<13w(範囲内)":"通常");
      return '<div class="stock '+(r.code===selected?"active":"")+'" data-code="'+r.code+'">'+
        '<div class="sn">'+r.name+'</div><div class="sc">'+(r.market||"指数")+'</div>'+
        '<div class="sp">'+fmt(r.price,r.currency)+' <span class="'+(r.changePct>=0?"up":"down")+'" style="font-size:11px">'+pct(r.changePct)+'</span></div>'+
        '<div class="v2" style="color:'+(mdc.warning?"#f85149":"#7d8590")+'">'+label+'</div>'+
        '<span class="chip '+(mdc.warning?"st-limit":"st-watch")+'">アノマリー監視</span></div>';
    }
    const vs200=r.sma200?(r.price/r.sma200-1)*100:null;
    return '<div class="stock '+(r.code===selected?"active":"")+'" data-code="'+r.code+'">'+
      '<div class="sn">'+r.name+'</div><div class="sc">'+r.code+'</div>'+
      '<div class="sp">'+fmt(r.price,r.currency)+' <span class="'+(r.changePct>=0?"up":"down")+'" style="font-size:11px">'+pct(r.changePct)+'</span></div>'+
      '<div class="v2 '+(vs200<0?"down":"up")+'">200日線比 '+pct(vs200)+'</div>'+
      '<span class="chip '+(ST[r.status]||"st-watch")+'">'+r.status+'</span></div>';
  }).join("");
  document.querySelectorAll(".stock").forEach(el=>el.onclick=()=>{selected=el.dataset.code;renderList();renderMain();});
}
function md(s){return s?marked.parse(s):'<span style="color:#6e7681">（未記入）</span>';}
function renderIndexMain(r){
  const main=document.getElementById("main"); const cur=r.currency||"USD";
  const mdc=r.miniDeadCross||{};
  const banner=mdc.warning
    ? '<div class="section" style="border-color:#f85149;background:#f8514914"><h2 style="color:#f85149">⚠️ ミニデッドクロス警戒中</h2>'+
      '<div class="prose">5週移動平均線が13週移動平均線を下回り、かつ現在値（'+fmt(r.price,cur)+'）がクロス前の持ち合いレンジ高値（'+fmt(mdc.rangeHigh,cur)+'、'+(mdc.crossDate||"—")+'クロス）を<b>上に抜け返せていません</b>。1929年NYダウ・94年米株・90年日経平均と同型のパターンです。</div></div>'
    : (mdc.crossed
      ? '<div class="section" style="border-color:#d29922;background:#d2992214"><h2 style="color:#e3b341">5週線が13週線を下回っています</h2><div class="prose">ただし現在値がクロス前のレンジ高値（'+fmt(mdc.rangeHigh,cur)+'）を上回っており、「ミニデッドクロス警戒」の2条件目（抜け返せていない）はまだ満たしていません。</div></div>'
      : '<div class="section" style="border-color:#3fb950;background:#3fb95014"><h2 style="color:#3fb950">通常（5週線 &gt; 13週線）</h2><div class="prose">現在、週足5週移動平均線が13週移動平均線を上回っており、ミニデッドクロスの警戒状態ではありません。</div></div>');
  main.innerHTML=
   '<div class="head"><div><div class="name">'+r.name+' <span class="code">'+(r.symbol||r.code)+(r.market?" / "+r.market:"")+'</span></div>'+
     '<div class="asof">Yahoo Finance 週足（約15〜20分ディレイ）｜通貨: '+cur+'｜データ: '+(window.__ASOF||"—")+'時点</div></div>'+
     '<div style="text-align:right"><div class="price">'+fmt(r.price,cur)+'</div>'+
     '<div class="chg '+(r.changePct>=0?"up":"down")+'">'+(r.changePct>=0?"▲ ":"▼ ")+pct(r.changePct)+'（週次）</div></div></div>'+
   banner+
   '<div class="section"><h2>週足チャート：5週移動平均線／13週移動平均線</h2>'+
     '<div class="legend"><span><i style="background:#3fb950"></i>5週移動平均線</span><span><i style="background:#f85149"></i>13週移動平均線</span></div>'+
     '<div class="lwc"><div class="cv" id="chart"></div><div class="lg" id="lg"></div></div></div>'+
   '<div class="section"><h2>このアノマリーについて</h2><div class="prose">'+md(r.thesis)+'</div></div>'+
   '<div class="section"><h2>警戒の判定条件</h2><div class="prose">'+md(r.drivers)+'</div></div>'+
   '<div class="section"><h2>使い方の目安</h2><div class="prose">'+md(r.entryPlan)+'</div></div>'+
   '<div class="foot">株価・指標はYahoo Financeより取得（約15〜20分ディレイ）。この警戒判定は移動平均の機械的クロスによる簡易ロジックであり、投資推奨ではありません。</div>';
  drawIndexChart(r,cur);
}
function drawIndexChart(r,cur){
  const w=r.weekly; if(!w||!document.getElementById("chart")) return;
  const days=w.ts.map(t=>jd(t));
  const rows=days.map((d,i)=>[d,w.open?w.open[i]:null,w.high?w.high[i]:null,w.low?w.low[i]:null,w.close[i],null]);
  const c=newChart(cur,false);
  if(w.open) c.candle.setData(rows.map(x=>({time:x[0],open:x[1],high:x[2],low:x[3],close:x[4]})));
  else c.candle.setData([]), c.line.setData(rows.map(x=>({time:x[0],value:x[4]})));
  addLine(c,days,w.sma5,"#3fb950",2); addLine(c,days,w.sma13,"#f85149",2,true);
  c.ch.timeScale().fitContent(); bindLegend(c,rows,cur,"の週");
}
function renderMain(){
  const r=STOCKS.find(x=>x.code===selected); const main=document.getElementById("main");
  if(!r){main.innerHTML='<div class="empty">銘柄を選択</div>';return;}
  if(r.type==="index"){renderIndexMain(r);return;}
  const cur=r.currency||"JPY";
  const pos=(r.high52>r.low52)?((r.price-r.low52)/(r.high52-r.low52)*100):null;
  const fromPeak=r.high52?(r.price/r.high52-1)*100:null;
  const vs200=r.sma200?(r.price/r.sma200-1)*100:null; const below=vs200<0;
  main.innerHTML=
   '<div class="head"><div><div class="name">'+r.name+' <span class="code">'+r.code+(r.market?" / "+r.market:"")+'</span></div>'+
     '<div class="asof">Yahoo Finance（約15〜20分ディレイ）｜通貨: '+cur+'｜データ: '+(window.__ASOF||"—")+'時点</div></div>'+
     '<div style="text-align:right"><div class="price">'+fmt(r.price,cur)+'</div>'+
     '<div class="chg '+(r.changePct>=0?"up":"down")+'">'+(r.changePct>=0?"▲ ":"▼ ")+pct(r.changePct)+'</div></div></div>'+
   '<div class="cards">'+
     '<div class="card hl"><div class="label">PER(会社予想)</div><div class="val">'+num(r.per,1)+'倍</div><div class="sub">益回り≈'+(r.per?(100/r.per).toFixed(1)+"%":"—")+'</div></div>'+
     '<div class="card hl"><div class="label">EPS(会社予想)</div><div class="val">'+fmt(r.eps,cur)+'</div><div class="sub">予想割れでPER急騰</div></div>'+
     '<div class="card '+(below?"warn":"")+'"><div class="label">200日移動平均</div><div class="val">'+fmt(r.sma200,cur)+'</div><div class="sub" style="color:'+(below?"#f85149":"#3fb950")+'">'+(vs200!=null?"現在値は"+pct(vs200)+(below?"（線の下）":"（線の上）"):"—")+'</div></div>'+
     '<div class="card"><div class="label">PBR(実績)</div><div class="val">'+num(r.pbr,2)+'倍</div></div>'+
     '<div class="card"><div class="label">配当利回り</div><div class="val">'+num(r.divYield,2)+'%</div></div>'+
     '<div class="card"><div class="label">時価総額</div><div class="val" style="font-size:16px">'+(r.marketCap||"—")+'</div></div>'+
   '</div>'+
   '<div class="section"><h2>52週レンジの中の"現在地"</h2><div class="rangebar"><div class="track"></div>'+
     '<div class="marker" style="left:0%;background:#f85149"></div><div class="mlabel" style="left:0%"><span class="sm">安値</span>'+fmt(r.low52,cur)+'</div>'+
     (pos!=null?'<div class="marker" style="left:'+pos.toFixed(1)+'%"></div><div class="mlabel" style="left:'+pos.toFixed(1)+'%;color:#fff"><span class="sm">現在</span>'+fmt(r.price,cur)+'</div>':'')+
     '<div class="marker" style="left:100%;background:#3fb950"></div><div class="mlabel" style="left:100%"><span class="sm">高値</span>'+fmt(r.high52,cur)+'</div></div>'+
     '<div class="prose">'+(pos!=null?'現在値はレンジの<b>下から約'+pos.toFixed(0)+'%</b>。ピークから<b>'+pct(fromPeak)+'</b>。':'')+'</div></div>'+
   '<div class="section"><h2>チャート（ローソク足・移動平均線・出来高）</h2>'+
     '<div class="tbar" id="ranges"></div>'+
     '<div class="lwc"><div class="cv" id="chart"></div><div class="lg" id="lg"></div></div>'+
     '<div class="legend" id="mkey" style="flex-wrap:wrap;margin-top:8px"></div></div>'+
   '<div class="section"><h2>なぜ買う／買ってるか（thesis）</h2><div class="prose">'+md(r.thesis)+'</div></div>'+
   '<div class="section"><h2>ドライバー</h2><div class="prose">'+md(r.drivers)+'</div></div>'+
   '<div class="section"><h2>エントリー・撤退方針</h2><div class="prose">'+md(r.entryPlan)+'</div></div>'+
   '<div class="foot">株価・指標はYahoo Financeより取得（約15〜20分ディレイ）。EPS/PERは会社予想。本資料は分析であり投資推奨ではありません。<br>Charts by <a href="https://www.tradingview.com/" style="color:#7d8590">TradingView Lightweight Charts™</a></div>';
  drawChart(r,cur);
}
// ===== Lightweight Charts（2026-10-21 Chart.jsから置き換え）=====
const LW=LightweightCharts, UP="#ef4444", DN="#3b82f6";
let RANGE=250;
const jd=t=>{const d=new Date((t+9*3600)*1000);return d.toISOString().slice(0,10);};
function newChart(cur,withVol){
  if(chart){chart.remove();chart=null;}
  const el=document.getElementById("chart");
  const ch=LW.createChart(el,{autoSize:true,
    layout:{background:{color:"#0d1117"},textColor:"#adbac7",fontSize:11,panes:{separatorColor:"#21262d",enableResize:false}},
    grid:{vertLines:{color:"#161b22"},horzLines:{color:"#161b22"}},
    crosshair:{mode:LW.CrosshairMode.Normal},rightPriceScale:{borderColor:"#30363d"},timeScale:{borderColor:"#30363d",rightOffset:4},
    localization:{locale:"ja-JP",dateFormat:"yyyy/MM/dd",priceFormatter:p=>curSym(cur)+Math.round(p).toLocaleString()}});
  chart=ch;
  const candle=ch.addSeries(LW.CandlestickSeries,{upColor:UP,downColor:DN,borderVisible:false,wickUpColor:UP,wickDownColor:DN});
  const line=ch.addSeries(LW.LineSeries,{color:"#58a6ff",lineWidth:2,priceLineVisible:false});
  let vol=null;
  if(withVol){ vol=ch.addSeries(LW.HistogramSeries,{priceFormat:{type:"volume"},priceLineVisible:false,lastValueVisible:false},1); ch.panes()[1].setHeight(80); }
  return {ch,candle,line,vol};
}
function addLine(c,days,vals,color,w,dash){
  const s=c.ch.addSeries(LW.LineSeries,{color,lineWidth:w,lineStyle:dash?LW.LineStyle.Dashed:LW.LineStyle.Solid,priceLineVisible:false,lastValueVisible:false,crosshairMarkerVisible:false});
  s.setData(days.map((d,i)=>vals[i]==null?null:{time:d,value:vals[i]}).filter(Boolean)); return s;
}
function smaOf(close,n){return close.map((_,i)=>i<n-1?null:close.slice(i-n+1,i+1).reduce((a,b)=>a+b,0)/n);}
function bindLegend(c,rows,cur,suf){
  const lg=document.getElementById("lg"), f=v=>v==null?"—":curSym(cur)+Math.round(v).toLocaleString();
  const show=x=>{ if(!x) return; const k=x[1]==null||x[4]>=x[1]?"u":"d";
    lg.innerHTML=x[0].replaceAll("-","/")+(suf||"")+(x[1]==null?"　終 <b class=\""+k+"\">"+f(x[4])+"</b>":"<br>始 "+f(x[1])+"　高 "+f(x[2])+"　安 "+f(x[3])+"　終 <b class=\""+k+"\">"+f(x[4])+"</b>")+(x[5]!=null?"<br>出来高 "+x[5].toLocaleString():""); };
  show(rows[rows.length-1]);
  c.ch.subscribeCrosshairMove(p=>{ if(!p.time){show(rows[rows.length-1]);return;} show(rows.find(x=>x[0]===p.time)); });
}
function drawChart(r,cur){
  const k=r.chart; if(!k||!document.getElementById("chart")) return;
  const days=k.ts.map(jd), hasO=!!k.open;
  const rows=days.map((d,i)=>[d,hasO?k.open[i]:null,hasO?k.high[i]:null,hasO?k.low[i]:null,k.close[i],k.volume?k.volume[i]:null]);
  const c=newChart(cur,!!k.volume);
  if(hasO) c.candle.setData(rows.map(x=>({time:x[0],open:x[1],high:x[2],low:x[3],close:x[4]})));
  else c.line.setData(rows.map(x=>({time:x[0],value:x[4]})));
  if(c.vol) c.vol.setData(rows.map(x=>({time:x[0],value:x[5]||0,color:(x[1]!=null&&x[4]<x[1])?"rgba(59,130,246,.5)":"rgba(239,68,68,.5)"})));
  const MAS=[[5,"#f472b6",1],[25,"#e3b341",2],[75,"#3fb950",2]];
  MAS.forEach(([n,col,w])=>addLine(c,days,smaOf(k.close,n),col,w));
  addLine(c,days,k.sma||smaOf(k.close,200),"#e6edf3",1,true);
  if(r.high52) c.candle.createPriceLine({price:r.high52,color:"#e3b341",lineWidth:1,lineStyle:LW.LineStyle.Dotted,axisLabelVisible:true,title:"52週高値"});
  if(r.low52) c.candle.createPriceLine({price:r.low52,color:"#7d8590",lineWidth:1,lineStyle:LW.LineStyle.Dotted,axisLabelVisible:true,title:"52週安値"});
  // 25日線と75日線のクロス
  const a=smaOf(k.close,25), b=smaOf(k.close,75), mk=[];
  for(let i=1;i<days.length;i++){ if([a[i-1],b[i-1],a[i],b[i]].includes(null)) continue;
    if(a[i-1]<=b[i-1]&&a[i]>b[i]) mk.push({time:days[i],position:"belowBar",color:"#e3b341",shape:"arrowUp",text:"25↑75"});
    if(a[i-1]>=b[i-1]&&a[i]<b[i]) mk.push({time:days[i],position:"aboveBar",color:"#93c5fd",shape:"arrowDown",text:"25↓75"}); }
  if(hasO) LW.createSeriesMarkers(c.candle,mk);
  const setR=()=>c.ch.timeScale().setVisibleLogicalRange({from:Math.max(0,days.length-RANGE),to:days.length+3});
  const tb=document.getElementById("ranges");
  const draw=()=>{ tb.innerHTML=""; [[60,"3か月"],[120,"半年"],[250,"1年"],[490,"2年"]].forEach(([v,l])=>{
    const bt=document.createElement("button"); bt.textContent=l; if(v===RANGE) bt.className="on"; bt.onclick=()=>{RANGE=v;draw();setR();}; tb.appendChild(bt);}); };
  draw(); setR(); bindLegend(c,rows,cur,"");
  document.getElementById("mkey").innerHTML=MAS.map(([n,col])=>'<span><i style="background:'+col+'"></i>'+n+'日線</span>').join("")+
    '<span><i class="dash"></i>200日線</span><span>▲▼ 25日線と75日線のクロス</span><span>点線＝52週の高値・安値</span>';
}
fetch("./data.json").then(r=>r.json()).then(d=>{
  STOCKS=(d.stocks||d||[]).concat(d.indices||[]); window.__ASOF=d.asOf||"2026-09-24";
  selected=STOCKS[0]?STOCKS[0].code:null; renderList(); renderMain();
